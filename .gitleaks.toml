# gitleaks configuration.
#
# Run in CI via the official MIT-licensed image rather than gitleaks-action,
# which requires a paid GITLEAKS_LICENSE for organization-owned repositories.
#
# The allowlist below is deliberately narrow. Three synthetic constants in the
# test suite look like credentials to the generic-api-key rule, and they have to
# look like credentials — they exist to prove that RedactFilter scrubs values of
# exactly that shape. They are allowlisted by *exact value*, not by path, so a
# real secret pasted into a test file still fails the build.
#
# Do not add a path-wide exclusion here. The predecessor repos leaked a live
# webhook token through a debug log line and nine speaker bearer tokens through a
# saved HTML page; a broad allowlist is how the next one gets through.

title = "eventkit"

[extend]
useDefault = true

[[rules]]
# Speaker webform prefill links are bearer credentials. Nine live ones leaked in
# `links-for-speakers.html`. Catch the shape anywhere it appears.
id = "drupal-webform-prefill-token"
description = "Drupal webform prefill token in a query string"
regex = '''[?&]token=[A-Za-z0-9_-]{20,}'''
tags = ["drupal", "bearer"]

[allowlist]
description = "Synthetic fixtures used to test secret redaction"
regexes = [
  # tests/unit/test_logging.py — the secret whose scrubbing is under test.
  '''0123456789abcdef0123456789abcdef''',
  # src/eventkit/testing/plugin.py — STRONG_TEST_TOKEN, a 48-char value long
  # enough to clear the webhook strength check in fixtures.
  '''0123456789abcdef0123456789abcdef0123456789abcdef''',
  # tests/unit/test_logging.py — a fake speaker prefill token, shaped like the
  # real leaked ones so the redaction test is meaningful.
  '''Ab3xY9zQ1mN7pL2kR8sT4vW6uJ0hG5dF''',
]
