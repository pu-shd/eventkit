# One command, the same locally and in CI.
#
# Copy to .github/workflows/test.yml. The point of running the Docker `test`
# target rather than a bare `pip install && pytest` is that a green CI run then
# means the same thing as a green `docker-compose run --rm test` on a laptop —
# same Python, same Node, same system packages.

name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Two jobs rather than a matrix with a conditional service: GitHub Actions
  # rejects an empty `image:`, and the SQLite leg must not start a Postgres
  # container it will not use. The predecessor's workflow started one and then
  # pointed the suite at an in-memory SQLite anyway.
  sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the test image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          load: true
          tags: app-test:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the suite
        run: docker run --rm -e TEST_DATASTORE=sqlite app-test:ci

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the test image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          load: true
          tags: app-test:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the suite
        run: |
          docker run --rm --network host \
            -e TEST_DATASTORE=postgres \
            -e DATABASE_URL="postgresql+psycopg://postgres:ci@127.0.0.1:5432/ci" \
            app-test:ci

  # Nothing that reaches production should carry a real token, a real address,
  # or a real attendee. This is cheap and catches the mistake at review time.
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No live institutional addresses outside examples
        run: |
          if grep -rIn --exclude-dir=.git --exclude-dir=examples \
               --exclude-dir=node_modules -e '@princeton\.edu' . ; then
            echo "::error::A real address outside examples/. Use example.edu."
            exit 1
          fi

      - name: No committed bearer tokens
        run: |
          if grep -rIn --exclude-dir=.git --exclude-dir=node_modules \
               -e 'X-Drupal-Webhook-Token: *[A-Za-z0-9]' \
               -e '[?&]token=[A-Za-z0-9]\{20,\}' . ; then
            echo "::error::A token value is committed. Reference an env var instead."
            exit 1
          fi

      # Not gitleaks/gitleaks-action@v2: that wrapper requires a paid
      # GITLEAKS_LICENSE secret for organization-owned repositories and fails
      # the job without one. The scanner itself is MIT-licensed, so run the
      # official image directly.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            git /repo --redact --no-banner --verbose
