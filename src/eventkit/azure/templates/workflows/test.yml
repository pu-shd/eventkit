# One command, the same locally and in CI.
#
# Copy to .github/workflows/test.yml. The point of running the Docker `test`
# target rather than a bare `pip install && pytest` is that a green CI run then
# means the same thing as a green `docker-compose run --rm test` on a laptop —
# same Python, same Node, same system packages.

name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Two jobs rather than a matrix with a conditional service: GitHub Actions
  # rejects an empty `image:`, and the SQLite leg must not start a Postgres
  # container it will not use. The predecessor's workflow started one and then
  # pointed the suite at an in-memory SQLite anyway.
  sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # Plain docker, not a marketplace build action: the runner already has a
      # daemon, and one fewer third-party dependency in the path that produces
      # the image you ship is worth more than layer caching.
      - name: Build the test image
        run: docker build --target test -t app-test:ci .
      - name: Run the suite
        run: docker run --rm -e TEST_DATASTORE=sqlite app-test:ci

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      # Plain docker, not a marketplace build action: the runner already has a
      # daemon, and one fewer third-party dependency in the path that produces
      # the image you ship is worth more than layer caching.
      - name: Build the test image
        run: docker build --target test -t app-test:ci .
      - name: Run the suite
        run: |
          docker run --rm --network host \
            -e TEST_DATASTORE=postgres \
            -e DATABASE_URL="postgresql+psycopg://postgres:ci@127.0.0.1:5432/ci" \
            app-test:ci

  # Nothing that reaches production should carry a real token, a real address,
  # or a real attendee. This is cheap and catches the mistake at review time.
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No live institutional addresses outside examples
        run: |
          if grep -rIn --exclude-dir=.git --exclude-dir=examples \
               --exclude-dir=node_modules -e '@princeton\.edu' . ; then
            echo "::error::A real address outside examples/. Use example.edu."
            exit 1
          fi

      - name: No committed bearer tokens
        run: |
          if grep -rIn --exclude-dir=.git --exclude-dir=node_modules \
               -e 'X-Drupal-Webhook-Token: *[A-Za-z0-9]' \
               -e '[?&]token=[A-Za-z0-9]\{20,\}' . ; then
            echo "::error::A token value is committed. Reference an env var instead."
            exit 1
          fi

      - name: No credential-shaped literals
        run: |
          fail=0
          # -e, because a pattern beginning with a dash is otherwise read as a
          # flag; --exclude-dir=workflows, because this file carries the patterns
          # as data and would match itself.
          check() {
            if grep -rInE -e "$1" --exclude-dir=.git --exclude-dir=node_modules \
                 --exclude-dir=.venv --exclude-dir=workflows . ; then
              echo "::error::$2"; fail=1
            fi
          }
          check '-----BEGIN [A-Z ]*PRIVATE KEY-----' 'A private key is committed.'
          check '(AKIA|ASIA)[0-9A-Z]{16}' 'An AWS access key id is committed.'
          check 'gh[pousr]_[A-Za-z0-9]{36}' 'A GitHub token is committed.'
          check 'DefaultEndpointsProtocol=.*AccountKey=' 'An Azure connection string is committed.'
          [ "$fail" -eq 0 ] && echo "OK: nothing credential-shaped."
          exit "$fail"
